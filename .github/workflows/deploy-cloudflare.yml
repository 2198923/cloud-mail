name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "mail-worker/**"
      - "mail-vue/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-mail-grok-production
  cancel-in-progress: false

jobs:
  Deploy-cloud-mail:
    name: 🏗️ Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail-grok' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct' }}
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL || vars.CF_EMAIL || false }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || false }}
      LINUXDO_CLIENT_ID: ${{ secrets.LINUXDO_CLIENT_ID || vars.LINUXDO_CLIENT_ID }}
      LINUXDO_CALLBACK_URL: ${{ secrets.LINUXDO_CALLBACK_URL || vars.LINUXDO_CALLBACK_URL }}
      LINUXDO_SWITCH: ${{ secrets.LINUXDO_SWITCH || vars.LINUXDO_SWITCH }}


    steps:
      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            ./pnpm-lock.yaml
            ./mail-worker/pnpm-lock.yaml
            ./mail-vue/pnpm-lock.yaml

      - name: 📦 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 单测并构建 / Test and build
        run: |
          pnpm --dir ./mail-worker run test:unit
          pnpm --dir ./mail-vue run build

      - name: 📡 禁用 Wrangler 遥测 / Disable wrangler telemetry
        working-directory: ./mail-worker
        run: pnpm wrangler telemetry disable

      - name: 🛠️ 设置环境 / Set up environment
        working-directory: ./mail-worker
        env:
          ADMIN: ${{ secrets.ADMIN }}
          LINUXDO_SECRET_CONFIGURED: ${{ secrets.LINUXDO_CLIENT_SECRET != '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const required = [
            'NAME', 'CUSTOM_DOMAIN', 'DOMAIN', 'ADMIN', 'CLOUDFLARE_ACCOUNT_ID',
            'D1_DATABASE_ID', 'KV_NAMESPACE_ID',
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} cannot be empty`);
          }

          let domains;
          try {
            domains = JSON.parse(process.env.DOMAIN);
          } catch {
            throw new Error('DOMAIN must be valid JSON');
          }
          const dnsName = /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$/;
          if (!Array.isArray(domains) || domains.length === 0 ||
              domains.some(value => typeof value !== 'string' ||
                !dnsName.test(value.trim().toLowerCase()))) {
            throw new Error('DOMAIN must be a non-empty JSON array of DNS names');
          }
          domains = domains.map(value => value.trim().toLowerCase());
          if (!dnsName.test(process.env.CUSTOM_DOMAIN.toLowerCase())) {
            throw new Error('CUSTOM_DOMAIN must be a DNS name');
          }
          if (!/^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$/.test(process.env.NAME)) {
            throw new Error('NAME is not a valid Worker name');
          }
          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID) ||
              !/^[a-f0-9]{32}$/.test(process.env.KV_NAMESPACE_ID)) {
            throw new Error('Account and KV IDs must be 32-character hexadecimal IDs');
          }
          if (!/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/.test(process.env.D1_DATABASE_ID)) {
            throw new Error('D1_DATABASE_ID must be a canonical UUID');
          }
          const admin = process.env.ADMIN.trim().toLowerCase();
          if (!domains.some(domain => admin.endsWith(`@${domain}`)) ||
              !/^[^\s@]+@[^\s@]+$/.test(admin)) {
            throw new Error('ADMIN must belong to one of the configured mail domains');
          }
          if (process.env.R2_BUCKET_NAME &&
              !/^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$/.test(process.env.R2_BUCKET_NAME)) {
            throw new Error('R2_BUCKET_NAME is invalid');
          }

          const stringReplacements = {
            NAME: process.env.NAME,
            CUSTOM_DOMAIN: process.env.CUSTOM_DOMAIN.toLowerCase(),
            ADMIN: admin,
            D1_DATABASE_ID: process.env.D1_DATABASE_ID,
            KV_NAMESPACE_ID: process.env.KV_NAMESPACE_ID,
            R2_BUCKET_NAME: process.env.R2_BUCKET_NAME || '',
            PROJECT_LINK: process.env.PROJECT_LINK || '',
            ANALYSIS_CACHE: String(process.env.ANALYSIS_CACHE || 'false').toLowerCase(),
            AI_MODEL: process.env.AI_MODEL,
            LINUXDO_CLIENT_ID: process.env.LINUXDO_CLIENT_ID || '',
            LINUXDO_CALLBACK_URL: process.env.LINUXDO_CALLBACK_URL || '',
            LINUXDO_SWITCH: process.env.LINUXDO_SWITCH || '',
          };

          let config = await readFile('wrangler-action.toml', 'utf8');
          // Dependencies, tests and the frontend were already built before any
          // deployment credential entered the environment. Never run repository
          // build code as a child of Wrangler with CLOUDFLARE_API_TOKEN present.
          config = config.replace(/\n\[build\][\s\S]*$/, '\n');
          if (!process.env.R2_BUCKET_NAME) {
            config = config.replace(/\[\[r2_buckets\]\][\s\S]*?\n\n/, '');
          }
          if (!process.env.PROJECT_LINK) {
            config = config.replace(/^project_link = .*\n/m, '');
          }
          if (!process.env.LINUXDO_CLIENT_ID ||
              process.env.LINUXDO_SECRET_CONFIGURED !== 'true') {
            config = config.replace(/^linuxdo_client_id = .*\n(?:.*\n)*?^linuxdo_switch = .*\n/m, '');
          }
          if (String(process.env.CLOUDFLARE_EMAIL).toLowerCase() === 'true') {
            config += '\n[[send_email]]\nname = "email"\n';
          }
          config = config.replace('"${DOMAIN}"', JSON.stringify(domains));
          for (const [name, value] of Object.entries(stringReplacements)) {
            const placeholder = `\${${name}}`;
            config = config.split(`"${placeholder}"`)
              .join(JSON.stringify(value));
          }
          if (config.includes('${')) throw new Error('Unresolved Wrangler placeholder');
          await writeFile('wrangler-action.toml', config);
          NODE

      - name: 🚀 开始部署 / Start deployment
        id: deploy
        working-directory: ./mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN secret cannot be empty."
            exit 1
          fi
          echo "🚀 Starting deployment..."
          set +e
          pnpm wrangler deploy -c wrangler-action.toml 2>&1 \
            | sed -E -e 's/env\.domain .*/env.domain (***)/' -e 's/env\.admin .*/env.admin (***)/'
          DEPLOY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
            exit "$DEPLOY_EXIT_CODE"
          fi

      - name: 🔐 设置运行时 Secrets / Set runtime secrets
        working-directory: ./mail-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CF_EMAIL_ROUTING_TOKEN: ${{ secrets.CF_EMAIL_ROUTING_TOKEN }}
          LINUXDO_CLIENT_SECRET: ${{ secrets.LINUXDO_CLIENT_SECRET }}
        run: |
          if [ ${#JWT_SECRET} -lt 32 ] || [ -z "$CF_EMAIL_ROUTING_TOKEN" ]; then
            echo "❌ Required runtime secrets are missing or invalid."
            exit 1
          fi
          node -e '
            const secrets = {
              jwt_secret: process.env.JWT_SECRET,
              CF_EMAIL_ROUTING_TOKEN: process.env.CF_EMAIL_ROUTING_TOKEN,
            };
            if (process.env.LINUXDO_CLIENT_SECRET) {
              secrets.linuxdo_client_secret = process.env.LINUXDO_CLIENT_SECRET;
            }
            process.stdout.write(JSON.stringify(secrets));
          ' | pnpm wrangler secret bulk --name "$NAME"

      - name: 🗄️ 迁移 D1 / Migrate D1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.JWT_SECRET;
          if (!secret || secret.length < 32) {
            console.error('❌ JWT_SECRET is missing or invalid.');
            process.exit(1);
          }
          const url = `https://${process.env.CUSTOM_DOMAIN}/api/init/${encodeURIComponent(secret)}`;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(30_000) });
              const body = await response.text();
              if (response.ok && body === 'success') {
                console.log(`✅ D1 migration completed on attempt ${attempt}.`);
                process.exit(0);
              }
              console.error(`D1 migration attempt ${attempt} failed: HTTP ${response.status}`);
            } catch (error) {
              console.error(`D1 migration attempt ${attempt} failed: ${error.message}`);
            }
            await new Promise(resolve => setTimeout(resolve, 5_000));
          }
          console.error('❌ D1 migration failed.');
          process.exit(1);
          NODE

      - name: 🩺 验证生产 API / Verify production API
        run: |
          node --input-type=module <<'NODE'
          const url = `https://${process.env.CUSTOM_DOMAIN}/api/setting/websiteConfig`;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(15_000) });
              const body = await response.json();
              if (response.ok && body?.code === 200) {
                console.log(`✅ Production API healthy on attempt ${attempt}.`);
                process.exit(0);
              }
            } catch (error) {
              if (attempt === 12) console.error(error.message);
            }
            await new Promise(resolve => setTimeout(resolve, 5_000));
          }
          console.error('❌ Production API health check failed.');
          process.exit(1);
          NODE
