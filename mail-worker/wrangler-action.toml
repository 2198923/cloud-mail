name = "${NAME}"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[routes]]
pattern = "${CUSTOM_DOMAIN}"
custom_domain = true

[[d1_databases]]
binding = "db"
database_name = "${NAME}"
database_id = "${D1_DATABASE_ID}"

[[kv_namespaces]]
binding = "kv"
id = "${KV_NAMESPACE_ID}"

[[r2_buckets]]
binding = "r2"
bucket_name = "${R2_BUCKET_NAME}"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]


[vars]
ai_model = "${AI_MODEL}"
analysis_cache = "${ANALYSIS_CACHE}"
#orm_log = false
domain = "${DOMAIN}"
admin = "${ADMIN}"
project_link = "${PROJECT_LINK}"

linuxdo_client_id = "${LINUXDO_CLIENT_ID}"
linuxdo_callback_url = "${LINUXDO_CALLBACK_URL}"
linuxdo_switch = "${LINUXDO_SWITCH}"

# Production Email Routing uses exact literal-to-Worker rules per mailbox.
# The token remains a Worker Secret and must never be written to this file.
CF_EMAIL_ROUTING_ZONE_ID = "fea52fa74a3cb5c1d7ba332a9b82f9c9"
CF_EMAIL_ROUTING_DOMAIN = "grokmail.web3wy.com"
CF_EMAIL_ROUTING_WORKER = "cloud-mail-grok"
CF_EMAIL_ROUTING_RULE_LIMIT = "200"

[build]
command = "corepack pnpm install --frozen-lockfile && corepack pnpm run test:unit && corepack pnpm --dir ../mail-vue install --frozen-lockfile && corepack pnpm --dir ../mail-vue run build"
